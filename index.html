<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color" content="#0f1115">

    <title>File Viewer</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f1115;
            color: #ffffff;
        }

        body {
            overflow: hidden;
        }

        /* =========================
           FILE LIST SCREEN
        ========================== */

        #fileListScreen {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background:
                radial-gradient(
                    circle at top,
                    #1d2533 0%,
                    #0f1115 45%
                );
        }

        .header {
            padding: 22px 18px 15px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }

        .header p {
            margin: 7px 0 0;
            color: #9ca3af;
            font-size: 14px;
        }

        .files {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 10px 14px 30px;
        }

        .file-card {
            width: 100%;
            min-height: 72px;
            margin-bottom: 12px;

            display: flex;
            align-items: center;

            padding: 13px 15px;

            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;

            background: rgba(255,255,255,0.055);

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .file-card:active {
            transform: scale(0.98);
            background: rgba(255,255,255,0.10);
        }

        .file-icon {
            width: 48px;
            height: 48px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background: rgba(255,255,255,0.08);

            font-size: 24px;
        }

        .file-info {
            flex: 1;
            min-width: 0;
            margin-left: 13px;
        }

        .file-name {
            font-size: 16px;
            font-weight: 600;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-type {
            margin-top: 5px;

            font-size: 12px;
            color: #9ca3af;

            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .open-icon {
            margin-left: 10px;
            color: #9ca3af;
            font-size: 20px;
        }

        .empty {
            text-align: center;
            color: #9ca3af;
            padding: 50px 20px;
        }


        /* =========================
           VIEWER SCREEN
        ========================== */

        #viewerScreen {
            display: none;

            width: 100%;
            height: 100%;

            position: fixed;
            inset: 0;

            background: #000;

            z-index: 9999;
        }

        .viewer-header {
            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 58px;

            display: flex;
            align-items: center;

            padding: 7px 10px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.85),
                    rgba(0,0,0,0)
                );

            z-index: 10;
        }

        .back-button {
            width: 44px;
            height: 44px;

            border: none;
            border-radius: 50%;

            background: rgba(255,255,255,0.12);

            color: white;

            font-size: 23px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        .viewer-title {
            flex: 1;

            margin-left: 12px;

            font-size: 15px;
            font-weight: 600;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #viewerFrame {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: none;

            background: #000;
        }


        /* =========================
           LOADING
        ========================== */

        .loading {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            color: #ffffff;

            font-size: 14px;

            z-index: 5;
        }


        /* =========================
           DESKTOP
        ========================== */

        @media (min-width: 700px) {

            .header {
                padding-top: 35px;
            }

            .header h1 {
                font-size: 28px;
            }

            .files {
                padding-top: 20px;
            }

            .file-card:hover {
                background: rgba(255,255,255,0.09);
                transform: translateY(-1px);
            }
        }


        /* =========================
           SMALL MOBILE
        ========================== */

        @media (max-width: 380px) {

            .header h1 {
                font-size: 21px;
            }

            .file-card {
                min-height: 68px;
            }

            .file-icon {
                width: 44px;
                height: 44px;
                font-size: 21px;
            }

            .file-name {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>


    <!-- =========================================
         FILE LIST SCREEN
    ========================================== -->

    <div id="fileListScreen">

        <div class="header">
            <h1>Available Files</h1>
            <p>Select a file to open</p>
        </div>

        <div class="files" id="filesContainer"></div>

    </div>


    <!-- =========================================
         VIEWER SCREEN
    ========================================== -->

    <div id="viewerScreen">

        <div class="viewer-header">

            <button
                class="back-button"
                onclick="closeViewer()"
                aria-label="Back">
                ←
            </button>

            <div
                class="viewer-title"
                id="viewerTitle">
                File Viewer
            </div>

        </div>

        <div
            class="loading"
            id="loadingText">
            Loading...
        </div>

        <iframe
            id="viewerFrame"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>

    </div>


    <script>

        /* =====================================================
           FILE CONFIGURATION
           
           Add / remove files here.
           
           type:
           "video" = Google Drive video
           "pdf"   = Google Drive PDF
        ====================================================== */

        const files = [

            {
                name: "HP 1 Video",
                type: "video",
                url: "https://drive.google.com/file/d/146c3uFuOWB2fRzvnZnMWCFnGYnR4K2MW/preview"
            },

            {
                name: "HP 1 PDF",
                type: "pdf",
                url: "https://drive.google.com/file/d/1Ry3AMfPJjQKipB4nLAKCKXUFISpYCF2J/view?usp=sharing"
            },

            {
                name: "HP 2 Video",
                type: "video",
                url: "https://drive.google.com/file/d/146c3uFuOWB2fRzvnZnMWCFnGYnR4K2MW/preview"
            },

            {
                name: "HP 2 PDF",
                type: "pdf",
                url: "https://drive.google.com/file/d/1Ry3AMfPJjQKipB4nLAKCKXUFISpYCF2J/view?usp=sharing"
            }

        ];


        /* =====================================================
           GOOGLE APPS SCRIPT
        ====================================================== */

        const scriptUrl =
            "https://script.google.com/macros/s/AKfycbwq50GYdV-Ni85OJi0jKz92wON53HIAbIL1QnkHBJ9eQMge5lyR5_T_2NYC0ZZRfT3D4Q/exec";


        /* =====================================================
           CREATE FILE LIST
        ====================================================== */

        function createFileList() {

            const container =
                document.getElementById("filesContainer");

            container.innerHTML = "";


            if (files.length === 0) {

                container.innerHTML =
                    '<div class="empty">No files available.</div>';

                return;
            }


            files.forEach((file, index) => {

                const card =
                    document.createElement("div");

                card.className = "file-card";


                let icon = "📄";
                let typeText = "PDF DOCUMENT";


                if (file.type === "video") {
                    icon = "🎬";
                    typeText = "VIDEO";
                }


                card.innerHTML = `

                    <div class="file-icon">
                        ${icon}
                    </div>

                    <div class="file-info">

                        <div class="file-name">
                            ${escapeHtml(file.name)}
                        </div>

                        <div class="file-type">
                            ${typeText}
                        </div>

                    </div>

                    <div class="open-icon">
                        ›
                    </div>

                `;


                card.addEventListener(
                    "click",
                    function () {
                        openFile(index);
                    }
                );


                container.appendChild(card);

            });

        }


        /* =====================================================
           OPEN FILE
        ====================================================== */

        function openFile(index) {

            const file = files[index];

            if (!file) {
                return;
            }


            const listScreen =
                document.getElementById("fileListScreen");

            const viewerScreen =
                document.getElementById("viewerScreen");

            const frame =
                document.getElementById("viewerFrame");

            const title =
                document.getElementById("viewerTitle");

            const loading =
                document.getElementById("loadingText");


            title.textContent = file.name;

            loading.style.display = "block";


            /*
             * Hide file list
             */

            listScreen.style.display = "none";

            viewerScreen.style.display = "block";


            /*
             * Load Google Drive file
             */

            frame.src = file.url;


            /*
             * Hide loading after iframe loads
             */

            frame.onload = function () {

                loading.style.display = "none";

            };


            /*
             * Send notification
             */

            sendNotification(file.name);

        }


        /* =====================================================
           CLOSE VIEWER
        ====================================================== */

        function closeViewer() {

            const listScreen =
                document.getElementById("fileListScreen");

            const viewerScreen =
                document.getElementById("viewerScreen");

            const frame =
                document.getElementById("viewerFrame");


            /*
             * Stop video / PDF loading
             */

            frame.src = "about:blank";


            viewerScreen.style.display = "none";

            listScreen.style.display = "block";

        }


        /* =====================================================
           SEND NOTIFICATION
        ====================================================== */

        async function sendNotification(fileName) {

            let publicIp = "";


            /*
             * Get public IP
             */

            try {

                const ipResponse =
                    await fetch(
                        "https://api.ipify.org?format=json"
                    );

                const ipData =
                    await ipResponse.json();

                publicIp = ipData.ip;

            }

            catch (error) {

                console.error(
                    "IP fetch failed.",
                    error
                );

            }


            /*
             * Device information
             */

            const deviceData =
                navigator.userAgent;


            /*
             * Timestamp
             */

            const timestampData =
                new Date().toISOString();


            /*
             * Notification message
             */

            const message =
                "HP 1 is open by harprit | File: " +
                fileName;


            /*
             * Package data
             */

            const formData =
                new URLSearchParams({

                    message: message,

                    device: deviceData,

                    ip: publicIp,

                    timestamp: timestampData

                });


            /*
             * Send silently
             */

            try {

                await fetch(
                    scriptUrl,
                    {
                        method: "POST",

                        mode: "no-cors",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body: formData
                    }
                );


                console.log(
                    "Data successfully submitted."
                );

            }

            catch (error) {

                console.error(
                    "Notification error:",
                    error
                );

            }

        }


        /* =====================================================
           HTML ESCAPE
        ====================================================== */

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }


        /* =====================================================
           INITIALIZE
        ====================================================== */

        window.addEventListener(
            "DOMContentLoaded",
            function () {

                createFileList();

            }
        );

    </script>

</body>
</html>
