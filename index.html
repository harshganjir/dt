<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#080a0f">

<title>H Web</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    background:#080a0f;
    color:#fff;
}

body{
    overflow:hidden;
}


/* =====================================================
   MAIN
===================================================== */

#fileListScreen{
    width:100%;
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(90,105,255,.20),
            transparent 35%
        ),
        radial-gradient(
            circle at 100% 45%,
            rgba(0,190,255,.07),
            transparent 35%
        ),
        #080a0f;
}


/* =====================================================
   HEADER
===================================================== */

.top-header{
    max-width:760px;
    margin:auto;
    padding:28px 18px 14px;
    text-align:center;
}

.brand{
    display:inline-flex;
    align-items:center;
    gap:10px;
}

.brand-logo{
    width:44px;
    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:14px;

    font-size:23px;
    font-weight:850;

    color:#10131c;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #9ba7ff
        );

    box-shadow:
        0 12px 35px
        rgba(100,120,255,.28);
}

.brand-name{
    font-size:26px;
    font-weight:800;
    letter-spacing:-.7px;
}

.subtitle{
    margin-top:9px;
    color:#858d9e;
    font-size:13px;
}


/* =====================================================
   FILE LIST
===================================================== */

.files{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:12px 14px 40px;
}


/* =====================================================
   FILE CARD
===================================================== */

.file-card{

    width:100%;
    min-height:78px;

    margin-bottom:12px;

    display:flex;
    align-items:center;

    padding:13px 14px;

    border-radius:19px;

    border:
        1px solid
        rgba(255,255,255,.075);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.035),
        0 10px 35px
        rgba(0,0,0,.15);

    cursor:pointer;

    animation:
        cardIn .45s ease both;

    transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease;
}

.file-card:active{
    transform:scale(.985);
}

@media(min-width:700px){

    .file-card:hover{
        transform:translateY(-2px);

        border-color:
            rgba(150,160,255,.25);

        background:
            linear-gradient(
                135deg,
                rgba(255,255,255,.10),
                rgba(255,255,255,.035)
            );
    }
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =====================================================
   FILE ICON
===================================================== */

.file-icon{

    width:50px;
    height:50px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:15px;

    font-size:22px;

    background:
        rgba(255,255,255,.06);
}

.video-icon{

    background:
        linear-gradient(
            135deg,
            rgba(90,110,255,.23),
            rgba(0,190,255,.08)
        );
}

.pdf-icon{

    background:
        linear-gradient(
            135deg,
            rgba(255,75,90,.20),
            rgba(255,150,100,.07)
        );
}


/* =====================================================
   FILE INFO
===================================================== */

.file-info{
    flex:1;
    min-width:0;
    margin-left:13px;
}

.file-name{

    font-size:16px;
    font-weight:650;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.file-type{

    margin-top:5px;

    font-size:11px;
    font-weight:600;

    letter-spacing:.7px;

    color:#7d8597;
}


/* =====================================================
   OPEN ARROW
===================================================== */

.open-arrow{

    width:34px;
    height:34px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        rgba(255,255,255,.045);

    color:#9299a9;

    font-size:20px;
}


/* =====================================================
   VIEWER
===================================================== */

#viewerScreen{

    display:none;

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    background:#000;

    z-index:1000;
}

#viewerFrame{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    border:0;

    background:#000;
}


/* =====================================================
   VIEWER HEADER
===================================================== */

.viewer-header{

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:70px;

    display:flex;
    align-items:center;

    padding:10px 12px;

    z-index:30;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.92),
            rgba(0,0,0,.55),
            transparent
        );
}

.back-button{

    width:44px;
    height:44px;

    border:0;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    background:
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    font-size:22px;

    cursor:pointer;
}

.viewer-title{

    flex:1;
    min-width:0;

    margin-left:12px;

    font-size:15px;
    font-weight:650;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =====================================================
   LIKE BUTTON
===================================================== */

#likeArea{

    position:absolute;

    left:50%;

    bottom:
        calc(
            20px +
            env(safe-area-inset-bottom)
        );

    transform:translateX(-50%);

    z-index:40;
}

.like-button{

    min-width:120px;
    height:50px;

    padding:0 21px;

    border:1px solid
        rgba(255,255,255,.14);

    border-radius:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:8px;

    color:#fff;

    font-size:15px;
    font-weight:650;

    background:
        rgba(20,22,30,.78);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    box-shadow:
        0 12px 40px
        rgba(0,0,0,.45);

    cursor:pointer;

    transition:
        transform .18s ease,
        background .2s ease;
}

.like-button:active{
    transform:scale(.94);
}

.like-heart{
    font-size:21px;
}

.like-button.liked{

    background:
        linear-gradient(
            135deg,
            #ff3d69,
            #ff6688
        );

    border-color:
        rgba(255,170,190,.45);
}

.like-button.liked
.like-heart{

    animation:
        heartPop .35s ease;
}

@keyframes heartPop{

    0%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.45);
    }

    100%{
        transform:scale(1);
    }
}


/* =====================================================
   INITIAL LOADER
===================================================== */

#loader{

    position:fixed;

    inset:0;

    z-index:5000;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:
        radial-gradient(
            circle at center,
            #171c2a,
            #080a0f 65%
        );

    transition:
        opacity .45s ease,
        visibility .45s ease;
}

#loader.hide{

    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loader-logo{

    width:65px;
    height:65px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    font-size:32px;
    font-weight:850;

    color:#10131b;

    background:
        linear-gradient(
            135deg,
            #fff,
            #9ba7ff
        );

    box-shadow:
        0 15px 50px
        rgba(100,120,255,.28);

    animation:
        logoPulse 1.6s ease-in-out infinite;
}

.loader-name{

    margin-top:18px;

    font-size:21px;
    font-weight:750;
}

.loader-line{

    width:90px;
    height:3px;

    margin-top:18px;

    overflow:hidden;

    border-radius:5px;

    background:
        rgba(255,255,255,.10);
}

.loader-line::after{

    content:"";

    display:block;

    width:45%;
    height:100%;

    border-radius:5px;

    background:
        linear-gradient(
            90deg,
            #8b98ff,
            #fff
        );

    animation:
        loaderMove 1.1s ease-in-out infinite;
}

@keyframes logoPulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.055);
    }
}

@keyframes loaderMove{

    from{
        transform:translateX(-120%);
    }

    to{
        transform:translateX(230%);
    }
}


/* =====================================================
   VIEWER LOADER
===================================================== */

#viewerLoader{

    position:absolute;

    inset:0;

    z-index:20;

    display:none;

    align-items:center;
    justify-content:center;

    background:#000;
}

.viewer-spinner{

    width:42px;
    height:42px;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.15);

    border-top-color:#fff;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =====================================================
   EMPTY
===================================================== */

.empty{

    padding:70px 20px;

    text-align:center;

    color:#7d8597;

    font-size:14px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:480px){

    .top-header{

        padding-top:
            calc(
                22px +
                env(safe-area-inset-top)
            );
    }

    .brand-name{
        font-size:23px;
    }

    .file-card{
        min-height:74px;
    }

    .file-icon{
        width:47px;
        height:47px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     PREMIUM LOADER
===================================================== -->

<div id="loader">

    <div class="loader-logo">
        H
    </div>

    <div class="loader-name">
        H Web
    </div>

    <div class="loader-line"></div>

</div>


<!-- =====================================================
     FILE LIST
===================================================== -->

<div id="fileListScreen">

    <div class="top-header">

        <div class="brand">

            <div class="brand-logo">
                H
            </div>

            <div class="brand-name">
                H Web
            </div>

        </div>

        <div class="subtitle">
            Select a file to continue
        </div>

    </div>


    <div
        class="files"
        id="filesContainer">
    </div>

</div>


<!-- =====================================================
     VIEWER
===================================================== -->

<div id="viewerScreen">


    <div class="viewer-header">

        <button
            class="back-button"
            onclick="closeViewer()">

            ←

        </button>


        <div
            class="viewer-title"
            id="viewerTitle">

            H Web

        </div>

    </div>


    <div id="viewerLoader">

        <div class="viewer-spinner"></div>

    </div>


    <iframe
        id="viewerFrame"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>


    <!-- LIKE BUTTON FOR BOTH PDF + VIDEO -->

    <div id="likeArea">

        <button
            class="like-button"
            id="likeButton"
            onclick="likeCurrentFile()">

            <span
                class="like-heart"
                id="likeHeart">

                ♡

            </span>

            <span id="likeText">

                Like

            </span>

        </button>

    </div>


</div>



<script>
/* =====================================================
   USER
===================================================== */

const userName = "Harprit";


/* =====================================================
   PERMANENT BROWSER DEVICE ID
===================================================== */

function getDeviceId() {

    const storageKey = "hweb_harprit_device_id";

    let deviceId = localStorage.getItem(storageKey);

    if (!deviceId) {

        let randomPart = "";

        if (
            window.crypto &&
            typeof crypto.randomUUID === "function"
        ) {

            randomPart =
                crypto
                    .randomUUID()
                    .replace(/-/g, "")
                    .substring(0, 12)
                    .toUpperCase();

        } else {

            randomPart =
                Math.random()
                    .toString(36)
                    .substring(2, 14)
                    .toUpperCase();

        }

        deviceId = "HW-" + randomPart;

        localStorage.setItem(
            storageKey,
            deviceId
        );
    }

    return deviceId;
}


/* =====================================================
   FIXED DEVICE ID FOR THIS BROWSER
===================================================== */

const deviceId = getDeviceId();

console.log(
    "Harprit Device ID:",
    deviceId
);
</script>

</body>
</html>
